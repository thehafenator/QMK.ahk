[Settings]
inputBackend=auto
sendMode=auto
pasteMode=interception_paste
applyUserConfig=true
profilingEnabled=true
maxThresholdSuppress=true
singleKeyHoldThreshold=175.0
maxHoldThreshold=1000.0
maxBufferSize=20
quietPeriodDuration=200.0
modifierGestureWindow=1000.0
doubleTapThreshold=200.0
repeatInitialDelay=200
repeatInterval=15
useInterception=true

[CompiledShortcuts]
sourceCount=0
useGeneratedInclude=0
compileMode=full_native
callbackOutputMode=single
callbackCustomPath=

[Tools]
zigPath=
clangPath=
llvmProfdataPath=

[Paths]
configPath=.\QMKconfig.ini
interceptionDllPath=.\interception.dll
pgoBuildOptionsPath=.\build_options_pgo.zig
runtimeBuildOptionsPath=.\build_options_runtime.zig
pgoTrainerSourcePath=.\QMKCorePGOTrainer.zig
runtimeDllPath=.\QMKCoreProfiling.dll
sourcePath=.\QMKCore.zig
trainingDataDir=.\TrainingData
trainingDllPath=.\QMKTrainingData.dll
variablesPath=.\QMKVariables.ahk

[Compiler]
lastBuildMode=zig

[Build]
targetProfile=x64
optimization=ReleaseFast
lto=true
omitFramePointer=true
singleThreaded=true
stackCheck=false
unwindTables=false
